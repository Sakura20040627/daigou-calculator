<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050507"><title>Sakura ERP</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><aside><a class="brand" href="index.html"><i>S</i><b>Sakura ERP<small>代购工作台</small></b></a><nav><a class="active" href="index.html">▦　订单管理</a><a href="calculator.html">⌁　利润计算器</a></nav><footer>● 数据仅保存在本机</footer></aside><main><header><div><em>ORDER CENTER</em><h1>订单管理</h1><p>管理订单、利润与国际物流</p></div><button class="btn light" id="new">＋ 新建订单</button></header><section class="stats"><article><span>累计订单</span><strong id="nOrders">0</strong><small>全部订单</small></article><article><span>已完成</span><strong id="nDone">0</strong><small id="doneRate">完成率 0%</small></article><article><span>累计客户付款</span><strong id="revenue">¥0.00</strong><small>不含已取消</small></article><article><span>累计净利润</span><strong class="red" id="profit">¥0.00</strong><small>实时汇总</small></article></section><section class="panel"><div class="toolbar"><div id="filters"></div><label class="search">⌕ <input id="search" placeholder="搜索商品、客户、订单或快递单号"></label></div><div class="table"><table><thead><tr><th>订单</th><th>商品 / 客户</th><th>商品价</th><th>客户付款</th><th>净利润</th><th>状态</th><th>物流</th><th></th></tr></thead><tbody id="body"></tbody></table><div class="empty" id="empty"><b>还没有订单</b><span>点击“新建订单”记录第一笔代购</span></div></div></section><section class="panel track"><div class="section-head"><div><em>ZTO INTERNATIONAL</em><h2>站内物流查询</h2><p>输入中通国际快递单号，直接读取完整轨迹。</p></div><mark>安全后端代理</mark></div><form id="trackForm"><input id="trackNo" placeholder="例如：7712…"><button class="btn light">查询轨迹</button></form><div id="trackState" class="state">输入单号后开始查询</div><ol id="timeline"></ol></section></main></div><div class="backdrop" id="backdrop"><form class="modal" id="orderForm"><div class="section-head"><div><em>ORDER</em><h2 id="modalTitle">新建订单</h2></div><button type="button" class="x" id="close">×</button></div><div class="grid"><label>订单日期<input id="date" type="date"></label><label>状态<select id="status"><option>待购买</option><option>已购买</option><option>日本运输</option><option>已发国内</option><option>已完成</option><option>已取消</option></select></label><label>商品名称<input id="product" required></label><label>客户 / 闲鱼昵称<input id="customer"></label><label>商品价格（日元）<input id="priceJPY" type="number" value="10000"></label><label>交通费（日元）<input id="transportJPY" type="number" value="0"></label><label>对客汇率<input id="sellRate" type="number" step=".0001" value=".045"></label><label>实际成本汇率<input id="costRate" type="number" step=".0001" value=".0438"></label><label>闲鱼费率（%）<input id="xianyuRate" type="number" step=".1" value="1.6"></label><label>代购费率（%）<input id="serviceRate" type="number" step=".1" value="10"></label><label class="wide">中通国际快递单号<input id="trackingNo"></label><label class="wide">备注<textarea id="remark"></textarea></label></div><div class="actions"><button type="button" class="btn danger" id="remove">删除</button><span></span><button type="button" class="btn" id="cancel">取消</button><button class="btn light">保存订单</button></div></form></div><div class="toast" id="toast"></div><script src="app.js"></script></body></html>
