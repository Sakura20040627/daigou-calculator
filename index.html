<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050507"><title>Sakura ERP</title><link rel="stylesheet" href="styles.css?v=20260917-2"><link rel="stylesheet" href="auth.css"></head>
<body>
<div class="shell">
  <aside><a class="brand" href="index.html"><i>S</i><b>Sakura ERP<small>云端代购工作台</small></b></a><nav><a class="active" href="index.html">▦　订单管理</a><a href="calculator.html">⌁　利润计算器</a></nav><footer>● 云端实时同步</footer></aside>
  <main><header><div><em>ORDER CENTER</em><h1>订单管理</h1><p>管理订单与利润</p></div><button class="btn light" id="new">＋ 新建订单</button></header>
    <section class="stats"><article><span>累计订单</span><strong id="nOrders">0</strong><small>全部订单</small></article><article><span>已完成</span><strong id="nDone">0</strong><small id="doneRate">完成率 0%</small></article><article><span>累计客户付款</span><strong id="revenue">¥0.00</strong><small>全部订单</small></article><article><span>累计净利润</span><strong class="red" id="profit">¥0.00</strong><small>实时汇总</small></article></section>
    <section class="panel"><div class="toolbar"><div id="filters"></div><label class="search">⌕ <input id="search" placeholder="搜索商品、客户或订单"></label></div><div class="table"><table><thead><tr><th>订单</th><th>商品 / 客户</th><th>商品价</th><th>客户付款</th><th>净利润</th><th>状态</th><th></th></tr></thead><tbody id="body"></tbody></table><div class="empty" id="empty"><b>还没有订单</b><span>点击“新建订单”记录第一笔代购</span></div></div></section>
    <section class="panel customer-panel"><div class="customer-chart-head"><div><em>CUSTOMER SPEND</em><h2>客户消费金额</h2><p>按客户姓名匹配并汇总客户付款金额</p></div><span id="customerChartTotal">¥0.00</span></div><div id="customerChart" class="customer-chart" aria-label="客户消费金额统计图"></div></section>
  </main>
</div>
<div class="backdrop" id="backdrop"><form class="modal" id="orderForm"><div class="section-head"><div><em>ORDER</em><h2 id="modalTitle">新建订单</h2></div><button type="button" class="x" id="close">×</button></div><div class="grid"><label>订单日期<input id="date" type="date"></label><label>状态<select id="status"><option>待完成</option><option>已完成</option></select></label><label>商品名称<input id="product" required></label><label>客户 / 闲鱼昵称<input id="customer"></label><label>商品价格（日元）<input id="priceJPY" type="number" value="10000"></label><label>交通费（日元）<input id="transportJPY" type="number" value="1000"></label><label>对客汇率<input id="sellRate" type="number" step=".0001" value=".045"></label><label>实际成本汇率<input id="costRate" type="number" step=".0001" value=".0438"></label><label>闲鱼费率（%）<input id="xianyuRate" type="number" step=".1" value="0.6"></label><label>代购费率（%）<input id="serviceRate" type="number" step=".1" value="10"></label><label class="wide">备注<textarea id="remark"></textarea></label></div><div class="actions"><button type="button" class="btn danger" id="remove">删除</button><span></span><button type="button" class="btn" id="cancel">取消</button><button class="btn light">保存订单</button></div></form></div>
<div class="auth-backdrop" id="auth"><form class="auth-card" id="authForm"><em>SAKURA CLOUD</em><h2>登录云端 ERP</h2><p>登录后，订单会在电脑和手机之间同步。暂时不登录也可以直接使用本机模式。</p><label>邮箱<input id="authEmail" type="email" autocomplete="email" required></label><label>密码<input id="authPassword" type="password" autocomplete="current-password" minlength="6" required></label><div class="auth-error" id="authError"></div><button class="btn light" type="submit">登录云端</button><button class="btn" type="button" id="signup">注册新账户</button><button class="btn ghost" type="button" id="guest">先本地使用</button></form></div>
<div class="toast" id="toast"></div><script src="app.js?v=20260917-6"></script>
</body></html>
