<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d12">
<title>代购利润计算器</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0b0d12;color:#f5f7fa}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:26px 18px}.back{color:#aab2bd;text-decoration:none}.card{margin-top:16px;background:#12161d;border:1px solid #252c36;border-radius:16px;padding:22px}
h1{margin:0 0 6px;font-size:26px}.sub{color:#9aa3af;font-size:13px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;color:#98a1ad;font-size:11px;margin-bottom:6px}.field input{width:100%;background:#0e1319;border:1px solid #29313c;color:#fff;border-radius:10px;padding:11px 12px;font-size:15px}.result{margin-top:18px;background:#0e1319;border:1px solid #232a34;border-radius:13px;padding:14px}.row{display:flex;justify-content:space-between;gap:20px;padding:9px 0;border-bottom:1px solid #202630}.row:last-child{border-bottom:0}.row strong{font-variant-numeric:tabular-nums}.total{font-size:17px;font-weight:800}.profit{font-size:18px;font-weight:850;color:#ff858b}.rules{margin-top:14px;color:#929aa6;font-size:12px;line-height:1.7}
@media(max-width:620px){.grid{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap"><a class="back" href="index.html">← 返回订单管理</a><div class="card">
<h1>日本代购利润计算器</h1><div class="sub">按你的规则自动计算客户付款、闲鱼扣费和净利润。</div>
<div class="grid">
<div class="field"><label>商品价格（日元）</label><input id="price" type="number" value="10000"></div>
<div class="field"><label>实际交通费（日元）</label><input id="transport" type="number" value="1000"></div>
<div class="field"><label>对客结算汇率（CNY/JPY）</label><input id="sellRate" type="number" step="0.0001" value="0.045"></div>
<div class="field"><label>实际换汇成本（CNY/JPY）</label><input id="costRate" type="number" step="0.0001" value="0.0438"></div>
<div class="field"><label>闲鱼服务费率（%）</label><input id="xianyuRate" type="number" step="0.1" value="1.6"></div>
</div>
<div class="result">
<div class="row"><span>商品折算</span><strong id="goods">¥0.00</strong></div>
<div class="row"><span>10% 代购费</span><strong id="service">¥0.00</strong></div>
<div class="row"><span>客户承担交通费</span><strong id="traffic">¥0.00</strong></div>
<div class="row total"><span>客户总共支付</span><strong id="total">¥0.00</strong></div>
<div class="row"><span>闲鱼服务费</span><strong id="xy">¥0.00</strong></div>
<div class="row"><span>闲鱼扣费后到账</span><strong id="net">¥0.00</strong></div>
<div class="row"><span>商品实际成本</span><strong id="cost">¥0.00</strong></div>
<div class="row"><span>交通费实际成本</span><strong id="tcost">¥0.00</strong></div>
<div class="row profit"><span>预计总利润</span><strong id="profit">¥0.00</strong></div>
<div class="row"><span>利润率</span><strong id="rate">0.00%</strong></div>
</div>
<div class="rules">规则：商品＜10,000日元，客户承担全部交通费；10,000–19,999日元，客户承担一半交通费；≥20,000日元，客户免交通费。代购费为商品折算金额的10%。</div>
</div></div>
<script>
const $=id=>document.getElementById(id),m=n=>'¥'+(Number(n)||0).toFixed(2);
function calc(){const p=+$('price').value||0,t=+$('transport').value||0,s=+$('sellRate').value||0,c=+$('costRate').value||0,x=(+$('xianyuRate').value||0)/100;let tj=p<10000?t:p<20000?t/2:0;const goods=p*s,service=goods*.10,traffic=tj*s,total=goods+service+traffic,xy=total*x,net=total-xy,cost=p*c,tcost=t*c,profit=net-cost-tcost,rate=total?profit/total*100:0;$('goods').textContent=m(goods);$('service').textContent=m(service);$('traffic').textContent=m(traffic);$('total').textContent=m(total);$('xy').textContent=m(xy);$('net').textContent=m(net);$('cost').textContent=m(cost);$('tcost').textContent=m(tcost);$('profit').textContent=m(profit);$('rate').textContent=rate.toFixed(2)+'%'}
['price','transport','sellRate','costRate','xianyuRate'].forEach(id=>$(id).addEventListener('input',calc));calc();
</script></body></html>
