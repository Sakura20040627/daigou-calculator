<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050507"><title>利润计算器 · Sakura ERP</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><aside><a class="brand" href="index.html"><i>S</i><b>Sakura ERP<small>代购工作台</small></b></a><nav><a href="index.html">▦　订单管理</a><a class="active" href="calculator.html">⌁　利润计算器</a></nav><footer>● 独立计算，不修改订单</footer></aside><main><header><div><em>PROFIT CALCULATOR</em><h1>代购利润计算器</h1><p>按照当前规则核算报价与利润</p></div></header><div class="calc"><section class="panel pad"><div class="section-head"><div><h2>输入成本</h2><p>调整数字，结果会立即更新。</p></div></div><div class="grid"><label>商品价格（日元）<input id="price" type="number" value="10000"></label><label>实际交通费（日元）<input id="transport" type="number" value="1000"></label><label>对客结算汇率<input id="sellRate" type="number" step=".0001" value=".045"></label><label>实际换汇成本<input id="costRate" type="number" step=".0001" value=".0438"></label><label>闲鱼服务费率（%）<input id="xianyuRate" type="number" step=".1" value="0.6"></label><label>代购费率（%）<input id="serviceRate" type="number" step=".1" value="10"></label></div><div class="note"><b>交通费规则</b>　不足 10,000 日元客户全额承担；10,000–19,999 承担一半；20,000 以上免交通费。</div></section><section class="panel result"><em>ESTIMATE</em><span>预计净利润</span><strong id="profit">¥0.00</strong><mark id="rate">利润率 0.00%</mark><div id="rows"></div></section></div></main></div><script src="calculator.js"></script></body></html>
